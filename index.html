<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Casa Pino 2027</title>
<meta property="og:title" content="Casa Pino 2027: eerst de wijn, nu de rackets">
<meta property="og:description" content="Vul in wat je wilt: vluchten, padel en voetbal. Wie niet invult, speelt in het tweede viertal.">
<meta property="og:image" content="https://kjvcs.github.io/casa-pino/photo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Idee: een donker restaurant met kroonluchter. Zwart, warm goud, gebroken wit. Eén kolom, foto als bediening. */
:root {
  --bg: #0c0a08;
  --surface: #17130f;
  --surface-2: #211b14;
  --line: #352c20;
  --text: #f2e9d8;
  --muted: #a39579;
  --gold: #e0b868;
  --gold-ink: #1a1409;
  --bad: #e58a7a;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 1rem/1.5 var(--body); -webkit-text-size-adjust: 100%;
  font-variant-numeric: tabular-nums;
}
.wrap { max-width: 960px; margin: 0 auto; padding: 0 18px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* Kop */
.hero { padding: 44px 18px 22px; }
.eyebrow { margin: 0 0 10px; color: var(--gold); font-size: .85rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
h1 { margin: 0; font: 700 clamp(2.8rem, 9vw, 5.2rem)/.95 var(--display); letter-spacing: -.02em; text-wrap: balance; }
h1 em { font-style: italic; font-weight: 400; color: var(--gold); }
.sub { margin: 14px 0 0; font: italic 400 clamp(1.25rem, 3.4vw, 1.7rem)/1.25 var(--display); text-wrap: balance; }
.nudge { margin: 10px 0 0; color: var(--muted); max-width: 46ch; }
.count { margin: 16px 0 0; display: inline-block; padding: 5px 12px; border: 1px solid var(--line); border-radius: 99px; font-size: .85rem; color: var(--muted); }
.count b { color: var(--text); font-weight: 600; }

/* Foto als bediening */
.photo { position: relative; border-radius: 14px; overflow: hidden; background: var(--surface); line-height: 0; }
.photo img { width: 100%; height: auto; display: block; }
.hs {
  position: absolute; transform: translate(-50%, -50%); aspect-ratio: 1; padding: 0; cursor: pointer;
  border-radius: 50%; border: 2px dashed rgba(242, 233, 216, .55); background: transparent;
}
.hs:hover { background: rgba(224, 184, 104, .14); }
.hs.part { border: 2px solid rgba(224, 184, 104, .6); }
.hs.done { border: 3px solid var(--gold); box-shadow: 0 0 0 3px rgba(224, 184, 104, .22), 0 0 18px rgba(224, 184, 104, .5); }
.hs.done::after {
  content: "✓"; position: absolute; right: -6px; bottom: -6px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--gold); color: var(--gold-ink); font: 700 12px/20px var(--body); text-align: center;
}
.hs.me { outline: 2px solid #fff; outline-offset: 3px; }
.hs.out { border: 2px solid rgba(255, 255, 255, .16); cursor: default; }
.hs .tag {
  position: absolute; left: 50%; top: calc(100% + 7px); transform: translateX(-50%); opacity: 0; pointer-events: none;
  background: rgba(12, 10, 8, .86); color: var(--text); font: 600 .72rem/1.2 var(--body);
  padding: 3px 8px; border-radius: 99px; white-space: nowrap;
}
.hs:hover .tag, .hs:focus-visible .tag, .hs.me .tag { opacity: 1; }
.hint { margin: 12px 0 0; min-height: 1.5em; color: var(--muted); }
.hint b { color: var(--text); font-weight: 600; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: 99px; font-size: .9rem;
}
.chip:hover { border-color: var(--gold); }
.chip.me { border-color: var(--gold); background: var(--surface-2); }
.chip[disabled] { opacity: .45; cursor: default; }
.chip[disabled]:hover { border-color: var(--line); }
.chip .st { color: var(--gold); font-size: .8rem; }

/* Avatar: uitsnede uit dezelfde foto */
.av {
  --s: 34px; width: var(--s); height: var(--s); flex: none; border-radius: 50%;
  background-color: var(--surface-2); background-image: url(photo.jpg); background-repeat: no-repeat;
  background-size: calc(var(--s) / var(--rf));
  background-position: calc(var(--s) * (.5 - var(--fx) / var(--rf))) calc(var(--s) * (.5 - var(--fy) * .75 / var(--rf)));
  box-shadow: 0 0 0 2px var(--line);
}
.av.done { box-shadow: 0 0 0 2px var(--gold); }
.av.part { box-shadow: 0 0 0 2px rgba(224, 184, 104, .5); }

/* Tabs */
.tabs { display: flex; gap: 6px; margin-top: 26px; padding-bottom: 0; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 14px; cursor: pointer; color: var(--muted); font-weight: 600; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--gold); }
.badge { margin-left: 6px; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--gold); font-size: .8rem; }

main { padding-bottom: 80px; }
section[hidden] { display: none; }
.banner { margin: 16px 0 0; padding: 10px 14px; border-radius: 10px; background: #2a1814; border: 1px solid #5c2c22; color: var(--bad); }

/* Formulier */
.who { display: flex; align-items: center; gap: 12px; margin: 22px 0 6px; }
.who .av { --s: 48px; }
.who h2 { margin: 0; font: 700 1.5rem/1.1 var(--display); }
.who .meta { color: var(--muted); font-size: .9rem; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--gold); text-decoration: underline; cursor: pointer; }
h3.sec { margin: 34px 0 4px; color: var(--gold); font: 600 .85rem/1 var(--body); letter-spacing: .1em; text-transform: uppercase; }
fieldset.q { margin: 14px 0 0; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); min-width: 0; }
fieldset.q legend { padding: 0 6px; margin-left: -6px; font: 700 1.2rem/1.25 var(--display); text-wrap: balance; }
.help { margin: 2px 0 14px; color: var(--muted); font-size: .92rem; max-width: 62ch; }
.opts { display: grid; gap: 8px; }
.opts.chipsgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 640px) { .opts.chipsgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.opt {
  display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; cursor: pointer;
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
}
.opt:hover { border-color: #5a4a33; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .mark {
  flex: none; width: 20px; height: 20px; margin-top: 2px; border: 2px solid var(--muted); border-radius: 50%;
  display: grid; place-items: center;
}
.opt.multi .mark { border-radius: 6px; }
.opt .txt { display: grid; gap: 2px; min-width: 0; }
.opt .txt b { font-weight: 600; }
.opt .txt small { color: var(--muted); font-size: .85rem; line-height: 1.4; }
.opt:has(input:checked) { border-color: var(--gold); background: var(--surface-2); }
.opt:has(input:checked) .mark { border-color: var(--gold); background: var(--gold); }
.opt:has(input:checked) .mark::after { content: "✓"; color: var(--gold-ink); font: 700 12px/1 var(--body); }
.opt:has(input:focus-visible) { outline: 2px solid var(--gold); outline-offset: 2px; }
textarea {
  width: 100%; min-height: 92px; padding: 12px 14px; resize: vertical; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit;
}
.bar-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 24px 0 0; }
.btn { padding: 11px 18px; border-radius: 99px; border: 1px solid var(--gold); background: var(--gold); color: var(--gold-ink); font-weight: 700; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); font-weight: 600; }
.btn.ghost:hover { border-color: var(--gold); }
.status { color: var(--muted); font-size: .9rem; }
.status.err { color: var(--bad); }
.prompt { margin: 28px 0 0; padding: 22px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); }
.prompt b { color: var(--text); }

/* Stand van zaken */
.tile { margin: 22px 0 0; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.tile h2 { margin: 0 0 4px; font: 700 1.5rem/1.15 var(--display); }
.progress { height: 8px; margin: 12px 0; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--gold); }
.faces { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; }
.face { display: grid; justify-items: center; gap: 4px; font-size: .78rem; color: var(--muted); }
.face .av { --s: 44px; }
.qcard { margin: 14px 0 0; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.qcard h3 { margin: 0 0 12px; font: 700 1.15rem/1.25 var(--display); text-wrap: balance; }
.row { margin: 0 0 12px; }
.row:last-child { margin-bottom: 0; }
.rowhead { display: flex; justify-content: space-between; gap: 12px; font-size: .95rem; }
.rowhead span:last-child { color: var(--muted); }
.track { height: 10px; margin: 5px 0 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 99px; background: #6f5e3f; }
.row.lead .track i { background: var(--gold); }
.row.lead .rowhead span:first-child { font-weight: 700; }
.names { display: flex; flex-wrap: wrap; gap: 5px; }
.name { padding: 1px 9px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); font-size: .78rem; color: var(--muted); }
.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.notes li { padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); font-size: .92rem; }
.notes b { color: var(--gold); font-weight: 600; }
.muted { color: var(--muted); }
.tablewrap { overflow-x: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { color: var(--muted); font-weight: 600; white-space: nowrap; }
td.p { white-space: nowrap; }
td.p .cell { display: flex; align-items: center; gap: 8px; font-weight: 600; }
td.p .av { --s: 28px; }
td.none { color: #6a5d46; }
.foot { margin: 28px 0 0; color: var(--muted); font-size: .85rem; max-width: 62ch; }
@media (prefers-reduced-motion: no-preference) { .hs, .opt, .chip { transition: border-color .15s, background .15s; } }
</style>
</head>
<body>
<header class="hero wrap">
  <p class="eyebrow">Padelreis · do 4 t/m zo 7 maart 2027 · Alfàs del Pi</p>
  <h1>Casa Pino <em>2027</em></h1>
  <p class="sub">Eerst de wijn, nu de rackets.</p>
  <p class="nudge">Wie niet invult, speelt in het tweede viertal.</p>
  <p class="count" id="count"></p>
</header>

<section class="wrap" aria-label="Wie ben jij">
  <div class="photo">
    <img src="photo.jpg" width="1400" height="1050" alt="De groep aan een lange tafel onder een kroonluchter in een donker restaurant">
    <div id="hotspots"></div>
  </div>
  <p class="hint" id="hint" aria-live="polite"></p>
  <div class="chips" id="chips"></div>
</section>

<nav class="tabs wrap" role="tablist" aria-label="Weergave">
  <button class="tab" role="tab" id="tab-mine" aria-selected="true" aria-controls="mine">Mijn keuzes</button>
  <button class="tab" role="tab" id="tab-stand" aria-selected="false" aria-controls="stand">Stand van zaken <span class="badge" id="badge">0/8</span></button>
</nav>

<main class="wrap">
  <div id="banner" class="banner" hidden></div>
  <section id="mine" role="tabpanel" aria-labelledby="tab-mine"></section>
  <section id="stand" role="tabpanel" aria-labelledby="tab-stand" hidden></section>
</main>

<script type="module">
import { listen, save } from "./store.js";
import { QUESTIONS } from "./questions.js";
import { PEOPLE, TRIP } from "./people.js";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const byId = Object.fromEntries(PEOPLE.map((p) => [p.id, p]));
const going = PEOPLE.filter((p) => p.going !== false);
const required = QUESTIONS.filter((q) => q.type !== "text");

let me = null;
try { me = localStorage.getItem("casaPinoMe"); } catch (e) { /* geen opslag beschikbaar */ }
if (!byId[me] || byId[me].going === false) me = null;

let all = {};        // persoon-id -> { vraag-id: antwoord }
let mine = {};       // eigen antwoorden (lokaal leidend na de eerste lading)
let loaded = false;
let tab = "mine";

/* ---------- hulpfuncties ---------- */
const isAnswered = (q, v) =>
  q.type === "multi" ? Array.isArray(v) && v.length > 0 : typeof v === "string" && v !== "";
function progress(a) {
  a = a || {};
  const done = required.filter((q) => isAnswered(q, a[q.id])).length;
  return { done, total: required.length };
}
function statusOf(id) {
  const p = progress(all[id]);
  return p.done === 0 ? "none" : p.done === p.total ? "done" : "part";
}
const avatar = (p, size, cls = "") =>
  `<span class="av ${cls}" style="--s:${size}px;--fx:${p.fx};--fy:${p.fy};--rf:${(p.r * 2).toFixed(4)}" role="img" aria-label="${esc(p.name)}"></span>`;
const optOf = (q, id) => (q.options || []).find((o) => o.id === id);
function fmt(q, v, key = "label") {
  if (q.type === "text") return v || "-";
  if (q.type === "multi") return Array.isArray(v) && v.length ? v.map((id) => optOf(q, id)?.[key] ?? id).join(", ") : "-";
  return optOf(q, v)?.[key] ?? "-";
}

/* ---------- kop ---------- */
(function countdown() {
  const days = Math.ceil((new Date(TRIP.start + "T00:00:00") - new Date()) / 86400000);
  const el = $("#count");
  if (days > 0) el.innerHTML = `Nog <b>${days} dagen</b> om niet geblesseerd te raken`;
  else el.hidden = true;
})();

/* ---------- foto, chips, badge ---------- */
let hintText = "";
function renderHint() {
  const el = $("#hint");
  if (hintText) { el.innerHTML = hintText; return; }
  if (!me) { el.innerHTML = "<b>Tik jezelf aan op de foto</b>, of kies je naam hieronder."; return; }
  el.innerHTML = `Je bent <b>${esc(byId[me].name)}</b>. Gouden ring met vinkje: die heeft alles ingevuld.`;
}
function renderHotspots() {
  $("#hotspots").innerHTML = PEOPLE.map((p) => {
    const out = p.going === false;
    const cls = out ? "out" : statusOf(p.id) + (p.id === me ? " me" : "");
    const w = (p.r * 2 * 100).toFixed(2);
    return `<button class="hs ${cls}" data-id="${p.id}" style="left:${(p.fx * 100).toFixed(2)}%;top:${(p.fy * 100).toFixed(2)}%;width:${w}%" aria-label="${esc(p.name)}${out ? ", gaat niet mee" : ""}"><span class="tag">${esc(p.name)}</span></button>`;
  }).join("");
}
function renderChips() {
  $("#chips").innerHTML = PEOPLE.map((p) => {
    if (p.going === false) return "";
    const st = statusOf(p.id);
    return `<button class="chip ${p.id === me ? "me" : ""}" data-id="${p.id}">${avatar(p, 28, st)}<span>${esc(p.name)}</span>${st === "done" ? '<span class="st">✓</span>' : ""}</button>`;
  }).join("");
}
function renderBadge() {
  const n = going.filter((p) => statusOf(p.id) === "done").length;
  $("#badge").textContent = `${n}/${going.length}`;
}
function chooseMe(id) {
  const p = byId[id];
  if (!p) return;
  if (p.going === false) { hintText = "Zit wel op de foto, maar <b>gaat niet mee</b>."; renderHint(); setTimeout(() => { hintText = ""; renderHint(); }, 2600); return; }
  me = id; hintText = "";
  try { localStorage.setItem("casaPinoMe", id); } catch (e) { /* ok */ }
  mine = structuredClone(all[id] || {});
  setTab("mine");
  renderAll(true);
  $("#mine").scrollIntoView({ behavior: "smooth", block: "start" });
}
document.addEventListener("click", (e) => {
  const b = e.target.closest(".hs, .chip");
  if (b && b.dataset.id) chooseMe(b.dataset.id);
});

/* ---------- tabs ---------- */
function setTab(t) {
  tab = t;
  $("#mine").hidden = t !== "mine";
  $("#stand").hidden = t !== "stand";
  $("#tab-mine").setAttribute("aria-selected", t === "mine");
  $("#tab-stand").setAttribute("aria-selected", t === "stand");
}
$("#tab-mine").addEventListener("click", () => setTab("mine"));
$("#tab-stand").addEventListener("click", () => setTab("stand"));

/* ---------- formulier ---------- */
function renderForm() {
  const box = $("#mine");
  if (!me) {
    box.innerHTML = `<div class="prompt"><b>Wie ben jij?</b> Tik jezelf aan op de foto hierboven. Daarna verschijnen hier de vragen. Je keuzes worden meteen opgeslagen en iedereen kan ze zien in de stand van zaken.</div>`;
    return;
  }
  if (!loaded) { box.innerHTML = `<div class="prompt">Gegevens laden…</div>`; return; }
  const p = byId[me];
  let html = `<div class="who">${avatar(p, 48, statusOf(me))}<div><h2>${esc(p.name)}</h2><div class="meta"><span id="prog"></span> · <button class="linkbtn" id="notme">Niet jij?</button></div></div></div>`;
  let sec = "";
  for (const q of QUESTIONS) {
    if (q.section !== sec) { sec = q.section; html += `<h3 class="sec">${esc(sec)}</h3>`; }
    html += `<fieldset class="q" data-q="${q.id}"><legend>${esc(q.title)}</legend>${q.help ? `<p class="help">${esc(q.help)}</p>` : ""}`;
    if (q.type === "text") {
      html += `<textarea id="t_${q.id}" data-q="${q.id}" maxlength="500" placeholder="Optioneel"></textarea>`;
    } else {
      const multi = q.type === "multi";
      html += `<div class="opts ${q.layout === "chips" ? "chipsgrid" : ""}">`;
      for (const o of q.options) {
        html += `<label class="opt ${multi ? "multi" : ""}"><input type="${multi ? "checkbox" : "radio"}" name="q_${q.id}" value="${o.id}" data-q="${q.id}"><span class="mark"></span><span class="txt"><b>${esc(o.label)}</b>${o.detail ? `<small>${esc(o.detail)}</small>` : ""}</span></label>`;
      }
      html += `</div>`;
    }
    html += `</fieldset>`;
  }
  html += `<div class="bar-actions"><button class="btn" id="tostand">Bekijk de stand</button><button class="btn ghost" id="copy">Kopieer als bericht</button><span class="status" id="status" aria-live="polite"></span></div>`;
  box.innerHTML = html;
  // bestaande antwoorden terugzetten
  for (const q of QUESTIONS) {
    const v = mine[q.id];
    if (q.type === "text") { const t = box.querySelector(`#t_${q.id}`); if (t && v) t.value = v; continue; }
    box.querySelectorAll(`input[data-q="${q.id}"]`).forEach((i) => {
      i.checked = q.type === "multi" ? Array.isArray(v) && v.includes(i.value) : v === i.value;
    });
  }
  updateProg();
}
function updateProg() {
  const el = $("#prog");
  if (!el) return;
  const p = progress(mine);
  el.textContent = `${p.done} van ${p.total} vragen beantwoord`;
}
function setStatus(msg, err = false) {
  const el = $("#status");
  if (!el) return;
  el.textContent = msg; el.className = "status" + (err ? " err" : "");
}

$("#mine").addEventListener("change", (e) => {
  const input = e.target.closest("input[data-q]");
  if (!input || !me) return;
  const q = QUESTIONS.find((x) => x.id === input.dataset.q);
  if (q.type === "multi") {
    const all_ = [...$("#mine").querySelectorAll(`input[data-q="${q.id}"]`)];
    const opt = optOf(q, input.value);
    if (input.checked) {
      all_.forEach((i) => {
        const o = optOf(q, i.value);
        if (i !== input && (opt.exclusive || o.exclusive)) i.checked = false;
      });
    }
    mine[q.id] = all_.filter((i) => i.checked).map((i) => i.value);
  } else {
    mine[q.id] = input.value;
  }
  afterEdit();
});
let noteTimer;
$("#mine").addEventListener("input", (e) => {
  const t = e.target.closest("textarea[data-q]");
  if (!t || !me) return;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { mine[t.dataset.q] = t.value.trim().slice(0, 500); afterEdit(); }, 400);
});
$("#mine").addEventListener("click", async (e) => {
  if (e.target.id === "notme") {
    me = null; try { localStorage.removeItem("casaPinoMe"); } catch (x) { /* ok */ }
    renderAll(true); window.scrollTo({ top: 0, behavior: "smooth" });
  }
  if (e.target.id === "tostand") { setTab("stand"); $("#tab-stand").scrollIntoView({ behavior: "smooth", block: "start" }); }
  if (e.target.id === "copy") {
    const p = byId[me];
    let t = `Casa Pino 2027, keuzes van ${p.name}\n`;
    QUESTIONS.forEach((q) => { t += `\n${q.title}\n→ ${fmt(q, mine[q.id])}`; });
    try { await navigator.clipboard.writeText(t); setStatus("Gekopieerd. Plak het in de groepsapp."); }
    catch (x) { setStatus("Kopiëren lukte niet op dit apparaat.", true); }
  }
});

/* ---------- opslaan ---------- */
let saveTimer, saving = false, again = false;
function afterEdit() {
  all[me] = mine;
  updateProg(); renderHotspots(); renderChips(); renderBadge(); renderStand();
  setStatus("Opslaan…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 500);
}
async function doSave() {
  if (saving) { again = true; return; }
  saving = true;
  do {
    again = false;
    try { await save(me, byId[me].name, mine); setStatus("Opgeslagen ✓"); }
    catch (e) {
      setStatus(e && e.code === "permission-denied"
        ? "Opslaan mislukt: de Firestore-regels staan nog niet goed. Geef dit door aan Kai."
        : "Opslaan mislukt. Controleer je verbinding en probeer het opnieuw.", true);
    }
  } while (again);
  saving = false;
}

/* ---------- stand van zaken ---------- */
function names(ids) {
  return ids.map((id) => `<span class="name">${esc(byId[id].name)}</span>`).join("");
}
function renderStand() {
  const resp = going.filter((p) => progress(all[p.id]).done > 0).map((p) => p.id);
  const done = going.filter((p) => statusOf(p.id) === "done");
  const open = going.filter((p) => statusOf(p.id) !== "done");
  let h = `<div class="tile"><h2>${done.length} van ${going.length} hebben alles ingevuld</h2>`;
  h += `<div class="progress" aria-hidden="true"><i style="width:${(done.length / going.length) * 100}%"></i></div>`;
  h += `<div class="muted">${open.length ? `Nog open: ${open.map((p) => esc(p.name)).join(", ")}.` : "Iedereen is er. Nu beslist Kai."}</div>`;
  h += `<div class="faces">${going.map((p) => `<div class="face">${avatar(p, 44, statusOf(p.id))}<span>${esc(p.name)}</span></div>`).join("")}</div></div>`;

  for (const q of QUESTIONS) {
    h += `<div class="qcard"><h3>${esc(q.title)}</h3>`;
    if (q.type === "text") {
      const items = going.filter((p) => (all[p.id] || {})[q.id]);
      h += items.length
        ? `<ul class="notes">${items.map((p) => `<li><b>${esc(p.name)}:</b> ${esc(all[p.id][q.id])}</li>`).join("")}</ul>`
        : `<div class="muted">Nog geen opmerkingen.</div>`;
    } else {
      const counts = q.options.map((o) => {
        const ids = going.filter((p) => {
          const v = (all[p.id] || {})[q.id];
          return q.type === "multi" ? Array.isArray(v) && v.includes(o.id) : v === o.id;
        }).map((p) => p.id);
        return { o, ids };
      });
      const max = Math.max(...counts.map((c) => c.ids.length));
      const base = Math.max(going.length, 1);
      if (max === 0) h += `<div class="muted">Nog geen antwoorden.</div>`;
      counts.forEach((c) => {
        const lead = max > 0 && c.ids.length === max;
        h += `<div class="row ${lead ? "lead" : ""}"><div class="rowhead"><span>${esc(c.o.label)}</span><span>${c.ids.length}</span></div><div class="track"><i style="width:${(c.ids.length / base) * 100}%"></i></div><div class="names">${names(c.ids)}</div></div>`;
      });
    }
    h += `</div>`;
  }

  h += `<h3 class="sec">Per persoon</h3><div class="tablewrap"><table><thead><tr><th>Wie</th>${QUESTIONS.filter((q) => q.type !== "text").map((q) => `<th>${esc(q.title.replace(/\?$/, ""))}</th>`).join("")}</tr></thead><tbody>`;
  going.forEach((p) => {
    h += `<tr><td class="p"><span class="cell">${avatar(p, 28, statusOf(p.id))}${esc(p.name)}</span></td>`;
    QUESTIONS.filter((q) => q.type !== "text").forEach((q) => {
      const v = (all[p.id] || {})[q.id];
      h += isAnswered(q, v) ? `<td>${esc(fmt(q, v, "short"))}</td>` : `<td class="none">nog niet</td>`;
    });
    h += `</tr>`;
  });
  h += `</tbody></table></div><p class="foot">Dit zijn voorkeuren, geen stemming. Kai beslist en boekt op basis van deze stand. Prijzen voor padel en tickets zijn schattingen.</p>`;
  $("#stand").innerHTML = h;
}

/* ---------- alles tekenen ---------- */
function renderAll(withForm) {
  renderHint(); renderHotspots(); renderChips(); renderBadge(); renderStand();
  if (withForm) renderForm();
}
renderAll(true);

/* ---------- verbinding ---------- */
const banner = $("#banner");
const slow = setTimeout(() => {
  banner.hidden = false;
  banner.textContent = "De gegevens zijn nog niet bereikbaar. Controleer je verbinding of probeer het zo nog eens.";
}, 10000);
listen((data) => {
  clearTimeout(slow); banner.hidden = true;
  const first = !loaded;
  all = data;
  if (first) { loaded = true; mine = structuredClone(all[me] || {}); }
  else if (me) all[me] = mine;
  renderAll(first);
}, (err) => {
  clearTimeout(slow);
  banner.hidden = false;
  banner.textContent = err && err.code === "permission-denied"
    ? "Geen toegang tot de gegevens. Kai: controleer de Firestore-regels."
    : "Er ging iets mis met de verbinding. Vernieuw de pagina.";
  if (!loaded) { loaded = true; renderForm(); }
});
</script>
</body>
